<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CuBot URDF Viewer</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2e323a; --fg:#e8e6e1; --dim:#9a9ca3; --accent:#3b82f6;
          --r0:#7d8189; --r1:#3b82f6; --r2:#b067f2; --r3:#22c55e; --moving:#e8833a; --still:#d9d4c7; --spacer:#6b7280; --wires:#db2626;
          --ok:#22c55e; --bad:#ef4444; --mono:ui-monospace,Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg);
              font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  #app { display:grid; grid-template-rows:auto 1fr; height:100%; }
  header { padding:10px 16px 10px; border-bottom:1px solid var(--line); background:var(--panel); }
  .row { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  h1 code { font:600 14px var(--mono); color:var(--fg); }
  .stat { color:var(--dim); font-size:12.5px; font-variant-numeric:tabular-nums; }
  .stat b { color:var(--fg); font-weight:600; }
  .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  #summary.ok { color:var(--ok); } #summary.bad { color:var(--bad); }
  /* the chain strip: module | roll digit | module | ... */
  #strip { display:grid; grid-template-columns:repeat(26, minmax(0,1fr) 12px) minmax(0,1fr); gap:2px; margin-top:9px; align-items:stretch; }
  #strip .m { border:1px solid var(--line); background:transparent; color:var(--dim); border-radius:4px; padding:3px 0 2px;
              font:600 12px var(--mono); cursor:pointer; line-height:1.15; min-width:0; }
  #strip .m small { display:block; font-weight:400; font-size:9.5px; color:var(--dim); }
  #strip .m.turned { color:var(--fg); border-color:#4a5263; background:#2b3140; }
  #strip .m.turned small { color:var(--moving); }
  #strip .m.sel { outline:2px solid #fff; outline-offset:1px; color:var(--fg); }
  #strip .d { align-self:center; height:22px; border-radius:3px; font:600 10px/22px var(--mono); text-align:center; color:#fff; }
  .legend { display:flex; gap:12px; font-size:12px; color:var(--dim); flex-wrap:wrap; margin-top:8px; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:4px; }
  .legend label { cursor:pointer; user-select:none; } .legend input { vertical-align:-1px; margin:0 3px 0 0; accent-color:var(--accent); }
  main { position:relative; min-height:0; }
  canvas { display:block; }
  .card { position:absolute; background:rgba(29,32,38,.94); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .card h2 { margin:0 0 6px; font-size:13px; font-weight:600; }
  .card p { margin:4px 0 0; color:var(--dim); font-size:12.5px; }
  #servo { left:14px; bottom:14px; width:min(360px, calc(100% - 28px)); }
  #servo .big { font:600 30px var(--mono); font-variant-numeric:tabular-nums; color:var(--moving); line-height:1.1; }
  #servo .big span { font-size:14px; color:var(--dim); font-weight:400; }
  #angle { width:100%; margin:8px 0 6px; accent-color:var(--moving); }
  .btns { display:flex; gap:6px; flex-wrap:wrap; }
  .btns button { background:transparent; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 10px;
                 font:600 12px var(--mono); cursor:pointer; }
  .btns button:hover { border-color:#4a5263; background:#2b3140; }
  .btns button.on { background:#3a2a1e; border-color:var(--moving); color:var(--moving); }
  .btns button.text { font-family:inherit; font-weight:500; color:var(--dim); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #checks { right:14px; top:14px; width:min(330px, calc(100% - 28px)); max-height:calc(100% - 28px); overflow:auto; }
  #checks ul { list-style:none; margin:0; padding:0; display:grid; gap:4px; }
  #checks li { display:grid; grid-template-columns:14px 1fr; gap:8px; font-size:12.5px; align-items:baseline; }
  #checks li i { font-style:normal; font-weight:700; } #checks li.ok i { color:var(--ok); } #checks li.bad i { color:var(--bad); }
  #checks li .v { color:var(--dim); font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:11.5px; display:block; }
  #hint { position:absolute; right:14px; bottom:14px; color:var(--dim); font-size:12px; text-align:right; }
  @media (max-width: 700px) { #checks { top:auto; bottom:14px; right:14px; left:14px; width:auto; max-height:40%; } #servo { bottom:auto; top:14px; } #hint { display:none; } }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

<div id="app">
  <header>
    <div class="row">
      <h1><code>cubot_shipped.urdf</code></h1>
      <span class="stat" id="summary">parsing…</span>
      <span class="stat" id="meta"></span>
    </div>
    <div id="strip"></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--still)"></i>still half</span>
      <span><i class="sw" style="background:var(--moving)"></i>moving half</span>
      <span><i class="sw" style="background:var(--spacer)"></i>spacer</span>
      <span><i class="sw" style="background:var(--wires)"></i>wires (keep-out)</span>
      <span>roll digit: <i class="sw" style="background:var(--r0)"></i>0° <i class="sw" style="background:var(--r1)"></i>90° <i class="sw" style="background:var(--r2)"></i>180° <i class="sw" style="background:var(--r3)"></i>270°</span>
      <label><input type="checkbox" id="tEdges" checked>edges</label>
      <label><input type="checkbox" id="tSpacer" checked>spacers</label>
      <label><input type="checkbox" id="tWires" checked>wires</label>
      <label><input type="checkbox" id="tAxis">hinge axes</label>
      <label><input type="checkbox" id="tGhost">ideal 80 mm cube</label>
    </div>
  </header>
  <main id="stage">
    <div class="card" id="servo"></div>
    <div class="card" id="checks"><h2>Checks against the shipped configuration</h2><ul id="checkList"></ul></div>
    <div id="hint">drag to orbit · scroll to zoom · click a module · ←/→ select · ↑/↓ detents · 0 reset · Esc whole chain</div>
  </main>
</div>

const view = { target: new THREE.Vector3(), pos: new THREE.Vector3(), anim: 0 };
function whole() {
  const cx = span / 2, wide = stage.clientWidth / Math.max(stage.clientHeight, 1), dist = 2400 / Math.min(1, wide / 1.6);
  view.target.set(cx, 0, 0); view.pos.set(cx - dist * .15, -dist, dist * .45); view.anim = 1;
}
function select(k, focus = true) {
  sel = k; sweeping = false; refresh();
  if (!focus) return;
  const c = centre(servos[k].joint.parent); view.target.copy(c); view.pos.set(c.x - 200, c.y - 480, c.z + 300); view.anim = 1;
}
document.getElementById('tEdges').onchange = e => edgeObjs.forEach(o => o.visible = e.target.checked);
document.getElementById('tSpacer').onchange = e => spacerObjs.forEach(o => o.visible = e.target.checked);
document.getElementById('tWires').onchange = e => wireObjs.forEach(o => o.visible = e.target.checked);
document.getElementById('tAxis').onchange = e => axisObjs.forEach(o => o.visible = e.target.checked);
document.getElementById('tGhost').onchange = e => ghostObjs.forEach(o => o.visible = e.target.checked);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'range' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
  if (e.key === 'ArrowRight') select(Math.min(N - 1, sel + 1));
  else if (e.key === 'ArrowLeft') select(Math.max(0, sel - 1));
  else if (e.key === 'ArrowUp') { setQ(sel, Math.min(LIM, Math.round(THREE.MathUtils.radToDeg(servos[sel].q) / LIM) * LIM + LIM)); refresh(); }
  else if (e.key === 'ArrowDown') { setQ(sel, Math.max(-LIM, Math.round(THREE.MathUtils.radToDeg(servos[sel].q) / LIM) * LIM - LIM)); refresh(); }
  else if (e.key === '0') { setQ(sel, 0); refresh(); }
  else if (e.key === 'Escape') { sweeping = false; refresh(); whole(); }
});
controls.addEventListener('start', () => { view.anim = 0; });
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);
resize(); refresh(); whole(); camera.position.copy(view.pos); controls.target.copy(view.target);
let tPrev = performance.now();
(function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - tPrev) / 1000); tPrev = now;
  if (sweeping) {   // back and forth between the two limits
    const s = servos[sel]; let deg = THREE.MathUtils.radToDeg(s.q) + sweepDir * 45 * dt;
    if (Math.abs(deg) >= LIM) { deg = Math.sign(deg) * LIM; sweepDir = -Math.sign(deg); }
    setQ(sel, deg); refresh(false); const r = card.querySelector('#angle'); if (r) r.value = deg.toFixed(0);
  }
  if (view.anim) { camera.position.lerp(view.pos, 0.12); controls.target.lerp(view.target, 0.12); if (camera.position.distanceTo(view.pos) < 1) view.anim = 0; }
  controls.update(); renderer.render(scene, camera);
})(tPrev);
</script>
