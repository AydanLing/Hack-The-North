<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CuBot Fold Viewer</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2e323a; --fg:#e8e6e1; --dim:#9a9ca3; --accent:#3b82f6;
          --moving:#e8833a; --still:#d9d4c7; --spacer:#6b7280; --base:#3b82f6; --wires:#db2626; --mA:#2b6cb0; --mB:#ec7048;
          --ok:#22c55e; --bad:#ef4444; --mono:ui-monospace,Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--fg);
              font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  #app { display:grid; grid-template-rows:auto 1fr; grid-template-columns:248px minmax(0,1fr); height:100%; overflow:hidden; }
  header { grid-column:1 / -1; padding:10px 16px 10px; border-bottom:1px solid var(--line); background:var(--panel); min-width:0; }
  .row { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  h1 code { font:600 14px var(--mono); color:var(--fg); }
  .stat { color:var(--dim); font-size:12.5px; font-variant-numeric:tabular-nums; }
  .stat b { color:var(--fg); font-weight:600; }
  .stat.ok { color:var(--ok); } .stat.bad { color:var(--bad); }
  .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  #status { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px 16px; }
  #status .tag { display:inline-block; padding:1px 7px; border-radius:99px; border:1px solid var(--line); font:600 11px var(--mono); color:var(--fg); }
  #status .tag.demo { border-color:var(--accent); } #status .tag.exploration { border-color:var(--ok); } #status .tag.atlas { border-color:var(--moving); }
  /* shape browser */
  #browser { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); background:var(--panel); }
  #browser .search { padding:8px 10px 6px; border-bottom:1px solid var(--line); }
  #browser input[type=search] { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:13px inherit; }
  #browser input[type=search]::placeholder { color:var(--dim); }
  #browser .count { color:var(--dim); font-size:11.5px; margin-top:4px; font-variant-numeric:tabular-nums; }
  #shapeList { overflow:auto; min-height:0; padding:4px 6px 10px; }
  #shapeList h3 { margin:8px 4px 3px; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--dim);
               display:flex; justify-content:space-between; }
  #shapeList h3 .n { font:500 11px var(--mono); }
  #shapeList h3 i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; vertical-align:0; }
  #shapeList h3.demo i { background:var(--accent); } #shapeList h3.exploration i { background:var(--ok); } #shapeList h3.atlas i { background:var(--moving); }
  #shapeList button { display:grid; grid-template-columns:50px 1fr; gap:0 8px; align-items:center; width:100%; text-align:left;
                   background:transparent; color:var(--dim); border:1px solid transparent; border-radius:6px; padding:3px 6px; cursor:pointer; }
  #shapeList button:hover { border-color:#4a5263; background:#2b3140; color:var(--fg); }
  #shapeList button.on { background:#2b3140; border-color:var(--accent); color:var(--fg); }
  #shapeList button.warn { border-color:#5a2a2a; } #shapeList button.warn.on { border-color:var(--bad); }
  #shapeList button canvas { display:block; width:50px; height:30px; grid-row:1 / 3; }
  #shapeList button .nm { font:600 12.5px var(--mono); line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #shapeList button .nm small { color:var(--dim); font-weight:400; margin-right:4px; }
  #shapeList button .mt { font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
  #shapeList button .mt .st { color:var(--moving); }
  #shapeList .empty { color:var(--dim); font-size:12.5px; padding:10px 6px; }
  .legend { display:flex; gap:12px; font-size:12px; color:var(--dim); flex-wrap:wrap; margin-top:8px; align-items:center; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:4px; }
  .legend label { cursor:pointer; user-select:none; } .legend input { vertical-align:-1px; margin:0 3px 0 0; accent-color:var(--accent); }
  .legend select { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:4px; font:12px inherit; padding:2px 4px; }
  main { position:relative; min-height:0; min-width:0; overflow:hidden; }
  canvas { display:block; }
  .card { position:absolute; background:rgba(29,32,38,.94); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .card h2 { margin:0 0 6px; font-size:13px; font-weight:600; }
  .card h2 span { color:var(--dim); font-weight:400; }
  .card p { margin:4px 0 0; color:var(--dim); font-size:12.5px; }
  /* transport */
  #transport { left:14px; bottom:14px; width:min(440px, calc(100% - 28px)); }
  #transport .big { font:600 26px var(--mono); font-variant-numeric:tabular-nums; line-height:1.1; }
  #transport .big span { font-size:13px; color:var(--dim); font-weight:400; }
  #transport .big em { font-style:normal; color:var(--moving); }
  #scrub { width:100%; margin:8px 0 6px; accent-color:var(--moving); }
  .btns { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .btns button { background:transparent; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 10px;
                 font:600 12px var(--mono); cursor:pointer; min-width:34px; }
  .btns button:hover { border-color:#4a5263; background:#2b3140; }
  .btns button.on { background:#3a2a1e; border-color:var(--moving); color:var(--moving); }
  .btns button.play { min-width:74px; }
  .btns button.text { font-family:inherit; font-weight:500; color:var(--dim); }
  .btns select { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:6px; font:600 12px var(--mono); padding:5px 6px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* moves + fold pattern */
  #moves { right:14px; top:14px; width:min(300px, calc(100% - 28px)); max-height:calc(58% - 14px); display:flex; flex-direction:column; }
  #pattern { display:grid; grid-template-columns:repeat(26, 1fr); gap:1px; margin:2px 0 8px; }
  #pattern i { display:block; height:9px; border-radius:1px; background:#2b2f37; }
  #pattern i.p { background:var(--moving); } #pattern i.m { background:var(--accent); }
  #pattern i.g { height:3px; opacity:.55; } #pattern i.g.p, #pattern i.g.m { opacity:.55; }
  #pattern i.hot { outline:1px solid var(--fg); outline-offset:1px; }
  #patternLabel { display:flex; justify-content:space-between; color:var(--dim); font-size:11px; }
  #patternText { display:block; font-size:11px; letter-spacing:.18em; color:var(--dim); margin:2px 0 8px; white-space:nowrap; }
  #patternLabel .sw { width:8px; height:8px; }
  #moveList { list-style:none; margin:0; padding:0; overflow:auto; display:grid; gap:2px; min-height:0; }
  #moveList li { display:grid; grid-template-columns:26px 1fr auto; gap:8px; font:12px var(--mono); font-variant-numeric:tabular-nums;
                 padding:3px 6px; border-radius:4px; cursor:pointer; color:var(--dim); border:1px solid transparent; }
  #moveList li:hover { background:#2b3140; color:var(--fg); }
  #moveList li.done { color:var(--fg); }
  #moveList li.active { background:#3a2a1e; border-color:var(--moving); color:var(--fg); }
  #moveList li .side { color:var(--dim); } #moveList li.active .side, #moveList li .in { color:var(--accent); }
  #moveList li .bad { color:var(--bad); font-weight:700; }
  #moveList li .t { color:var(--dim); font-size:11px; }
  /* silhouette */
  #sil { left:14px; top:14px; width:auto; }
  #silCanvas { display:block; margin-top:4px; }
  #hint { position:absolute; right:14px; bottom:14px; color:var(--dim); font-size:12px; text-align:right; }
  @media (max-width: 760px) {
    #app { grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto 1fr; }
    #browser { max-height:150px; border-right:0; border-bottom:1px solid var(--line); }
    #moves { max-height:38%; width:min(260px, 55%); }
    #sil { display:none; }
    #transport { width:calc(100% - 28px); }
    #hint { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

<div id="app">
  <header>
    <div class="row">
      <h1>CuBot fold viewer · <code>cubot_shipped.urdf</code></h1>
      <span class="stat" id="verify">checking…</span>
    </div>
    <div id="status"></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--still)"></i>still half</span>
      <span><i class="sw" style="background:var(--moving)"></i>moving half</span>
      <span><i class="sw" style="background:var(--base)"></i>module 0 (base)</span>
      <span title="keep-out: nothing may touch it; not part of the table settle"><i class="sw" style="background:var(--wires)"></i>wires</span>
      <label>colour <select id="colorMode"><option value="halves">still / moving</option><option value="modules">alternating modules</option></select></label>
      <label><input type="checkbox" id="tEdges" checked>edges</label>
      <label><input type="checkbox" id="tSpacer" checked>spacers</label>
      <label><input type="checkbox" id="tAxis" checked>hinge axis</label>
      <label><input type="checkbox" id="tFollow" checked>camera follows</label>
    </div>
  </header>
  <aside id="browser">
    <div class="search">
      <input type="search" id="search" placeholder="filter shapes (/)" aria-label="filter shapes" autocomplete="off">
      <div class="count" id="searchCount"></div>
    </div>
    <div id="shapeList"></div>
  </aside>
  <main id="stage">
    <div class="card" id="sil"><h2>Silhouette <span id="silLabel"></span></h2><canvas id="silCanvas" width="260" height="120"></canvas></div>
    <div class="card" id="moves">
      <h2>Fold pattern <span id="patternMeta">(joint 0 → 25)</span></h2>
      <div id="pattern" title="joint states now (tall) over the goal states (thin): blue −120°, grey 0°, orange +120°"></div>
      <div id="patternLabel"><span><i class="sw" style="background:var(--accent)"></i>−120°</span><span><i class="sw" style="background:#2b2f37"></i>0°</span><span><i class="sw" style="background:var(--moving)"></i>+120°</span></div>
      <span id="patternText" class="num" title="joint states now, joint 0 → 25"></span>
      <h2>Moves <span id="movesMeta"></span></h2><ul id="moveList"></ul>
    </div>
    <div class="card" id="transport"></div>
    <div id="hint">drag to orbit · scroll to zoom · space play/pause · ←/→ step · U unfold · F re-frame · 1–7 demo shapes · [ ] prev/next · / search</div>
  </main>
</div>

document.getElementById('bFwd').onclick = () => { playing = false; setTime(cum[Math.min(shape.moves.length, cur.m + 1)]); };
function togglePlay() {
  if (!playing) { if (dir > 0 && t >= T_END()) setTime(0); if (dir < 0 && t <= 0) setTime(T_END()); }
  playing = !playing; updateTransport();
}
bPlay.onclick = togglePlay;
bUnfold.onclick = () => { dir = -dir; if (playing) { /* keep playing, now the other way */ } updateTransport(); };
document.getElementById('speed').onchange = e => speed = +e.target.value;
document.getElementById('colorMode').onchange = e => pieces.forEach(p => p.mesh.material = p.mats[e.target.value]);
document.getElementById('tEdges').onchange = e => edgeObjs.forEach(o => o.visible = e.target.checked);
document.getElementById('tSpacer').onchange = e => spacerObjs.forEach(o => o.visible = e.target.checked);
document.getElementById('tAxis').onchange = () => setTime(t);
document.getElementById('tFollow').onchange = e => follow = e.target.checked;
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.target === searchEl) { if (e.key === 'Escape') { searchEl.value = ''; applyFilter(); searchEl.blur(); } else if (e.key === 'Enter') { const v = visibleIndices(); if (v.length) selectShape(v[0]); } return; }
  if (e.key === '/') { e.preventDefault(); searchEl.focus(); searchEl.select(); return; }
  if (e.key === '[' || e.key === ',') { stepShape(-1); return; }
  if (e.key === ']' || e.key === '.') { stepShape(1); return; }
  if (e.target.tagName === 'INPUT' && e.target.type === 'range' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight') document.getElementById('bFwd').click();
  else if (e.key === 'ArrowLeft') document.getElementById('bBack').click();
  else if (e.key === 'Home') document.getElementById('bStart').click();
  else if (e.key === 'End') document.getElementById('bEnd').click();
  else if (e.key === 'u' || e.key === 'U') bUnfold.click();
  else if (e.key === 'Escape' || e.key === 'f' || e.key === 'F') { follow = true; document.getElementById('tFollow').checked = true; frameWhole(); }
  else if (e.key >= '1' && e.key <= '7' && +e.key <= SHAPES.length) selectShape(+e.key - 1);
});

// ------------------------------------------------------------------ camera
let follow = true;
const view = { target: new THREE.Vector3(), pos: new THREE.Vector3(), anim: 0 };
function centroid() { const c = centres(), s = new THREE.Vector3(); c.forEach(v => s.add(v)); return s.divideScalar(c.length); }
function frameWhole() {   // fit the current pose: distance from the bounding radius of the module centres
  const c = centroid(), r = Math.max(...centres().map(v => v.distanceTo(c))) + 60;
  const wide = stage.clientWidth / Math.max(stage.clientHeight, 1), dist = Math.max(700, 2.4 * r) / Math.min(1, wide / 1.6);
  view.target.copy(c); view.pos.set(c.x - dist * .15, c.y - dist, c.z + dist * .5); view.anim = 1;
}
controls.addEventListener('start', () => { view.anim = 0; follow = false; document.getElementById('tFollow').checked = false; });
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

// ------------------------------------------------------------------ boot: verify every shape, then show the first
(function boot() {
  const report = []; let poses = 0;
  for (const s of SHAPES) { const r = buildRests(s); poses += r.length; const p = verifyShape(s, r); if (p.length) report.push(`${s.name}: ${p.join('; ')}`); }
  const el = document.getElementById('verify'); el.className = 'stat ' + (report.length ? 'bad' : 'ok');
  el.textContent = report.length ? `✗ ${report.length} of ${SHAPES.length} shapes disagree with the planner` : `✓ ${SHAPES.length}/${SHAPES.length} shapes · ${poses} rest poses reproduce cells_after / base_after`;
  el.title = report.join('\n') || `URDF pitch ${PITCH} mm`;
  console.log('[fold-viewer]', el.textContent, report);
  resize(); selectShape(0); camera.position.copy(view.pos); controls.target.copy(view.target);
})();

let tPrev = performance.now();
(function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - tPrev) / 1000); tPrev = now;
  if (playing) {
    const next = t + dir * speed * dt;
    if (next <= 0 || next >= T_END()) { playing = false; setTime(next <= 0 ? 0 : T_END()); }
    else setTime(next);
  }
  if (view.anim) { camera.position.lerp(view.pos, 0.12); controls.target.lerp(view.target, 0.12); if (camera.position.distanceTo(view.pos) < 1) view.anim = 0; }
  else if (follow) { const d = centroid().sub(controls.target).multiplyScalar(0.06); controls.target.add(d); camera.position.add(d); }
  controls.update(); renderer.render(scene, camera);
})(tPrev);
</script>
