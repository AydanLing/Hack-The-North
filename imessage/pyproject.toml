[project]
name = "cubot-imessage"
version = "1.0.0"
description = "Text CuBot a shape over iMessage: Linq webhook -> MiniLM intent -> CuBot V2 fold path."
requires-python = ">=3.10"
dependencies = []          # the bridge itself is stdlib only

[project.optional-dependencies]
# Training and the semantic half of the encoder. The bridge runs without these on `--encoder tfidf`.
model = ["numpy>=1.24", "onnxruntime>=1.16", "tokenizers>=0.15", "huggingface_hub>=0.20"]
dev = ["pytest>=8", "numpy>=1.24"]

[project.scripts]
cubot-imessage = "cubot_imessage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cubot_imessage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
