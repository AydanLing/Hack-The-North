[project]
name = "cubot-imessage"
version = "1.0.0"
description = "Text CuBot a shape over iMessage: Linq webhook -> MiniLM intent -> CuBot V2 fold path."
requires-python = ">=3.10"
dependencies = []          # stdlib only; the classifier comes from a snake_pipeline checkout

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cubot-imessage = "cubot_imessage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cubot_imessage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
