[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cubot-v2"
version = "0.1.0"
description = "Pre-simulation planning pipeline for the 27-module CuBot chain"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.0",
  "Pillow>=10.0",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
cubot = "cubot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cubot"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "cubot/_assets/config"
"data/golden" = "cubot/_assets/data/golden"
"data/solids" = "cubot/_assets/data/solids"
"data/imported" = "cubot/_assets/data/imported"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
