# ``loose`` plus hard caps on holding load, pivot-half dip, deep table hits,
# and large unsupported overhangs (CoM far outside the support hull).
# Stress is a gate; among survivors the planner prefers fewer moves.
[profile]
sweep_step_deg = 4.0
hard_penetration_mm = 6.0
soft_penetration_mm = 1.0
pivot_dip_exempt_mm = 3.0
ground_soft_mm = 3.0
# Reject big floor-slam sweeps (loose allows 40 mm).
ground_hard_mm = 15.0
torque_cap_nm = 5.8
torque_stall_nm = 10.6
# Soft preference: keep CoM over the support footprint when possible.
balance_margin_mm = 0.0
fold_budget_s = 60.0
node_budget = 300000
detour_budget = 12
side_ambiguity_ratio = 0.85
holding_hard_nm = 6.0
# One cube half tipping onto the table is ~24 mm; allow that, reject deeper digs.
pivot_dip_hard_mm = 25.0
# Hard-reject large overhangs (CoM well outside support). Soft score still uses balance_margin_mm.
balance_hard_mm = -50.0
